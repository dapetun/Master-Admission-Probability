# Скопируйте в seats.yaml и укажите число бюджетных мест по каждой программе.
# Имя программы должно совпадать с частью имени CSV-файла до суффикса .YYYY-MM-DD_...
#
# Пример имени файла:
#   Математика_машинного обучения.2026-08-16_20-17-34.csv
# → ключ: "Математика_машинного обучения"

programs:
  "Математика_машинного обучения": 20
  "Финансовые_технологии": 15
  "Прикладные_модели искусственного интеллекта": 0
  "Системный_анализ и математические технологии": 0
  "Умные_устройства_ аппаратная разработка": 0
