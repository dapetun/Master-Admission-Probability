    seats: 20
    title: Демо-программа А
    campus: Москва
    notes: пример
  Демо-программа Б (Москва):
    seats: 15
    title: Демо-программа Б
    campus: Москва
    notes: пример
  Демо-программа В (Санкт-Петербург):
    seats: null
